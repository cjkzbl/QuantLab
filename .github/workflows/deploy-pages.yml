name: Publish 50/50 BIL simulation and daily email

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the 50/50 BIL target allocation email
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test strategy and report generation
        run: python -m unittest discover -v

      - name: Refresh QQQ, TQQQ and BIL and build dashboard
        env:
          QUANTDASH_API_KEY: ${{ secrets.QUANTDASH_API_KEY }}
        run: |
          test -n "$QUANTDASH_API_KEY"
          python local_app.py --refresh

      - name: Verify the generated daily email without sending
        env:
          BUILD_RESULT: success
          DEPLOY_RESULT: pending
        run: python send_report_email.py --dry-run

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Upload strategy summary for email
        uses: actions/upload-artifact@v4
        with:
          name: daily-target-summary
          path: reports/summary.json
          if-no-files-found: error
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email)) }}
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Download strategy summary
        if: ${{ needs.build.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: daily-target-summary
          path: notification-report

      - name: Send daily result email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python send_report_email.py --report-dir notification-report
