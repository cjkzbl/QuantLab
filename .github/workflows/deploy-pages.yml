name: Update simulation and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh QQQ and TQQQ market data
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh data and build dashboard
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          QUANTDASH_API_KEY: ${{ secrets.QUANTDASH_API_KEY }}
        run: |
          test -n "$QUANTDASH_API_KEY"
          python local_app.py --refresh

      - name: Build dashboard from repository data
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh)
        run: python local_app.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
