name: Update simulation and deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh QQQ and TQQQ market data
        required: true
        default: true
        type: boolean
      send_email:
        description: Send the simulation report email
        required: true
        default: true
        type: boolean
  schedule:
    - cron: "30 18 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh data and build dashboard
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          QUANTDASH_API_KEY: ${{ secrets.QUANTDASH_API_KEY }}
        run: |
          test -n "$QUANTDASH_API_KEY"
          python local_app.py --refresh

      - name: Verify refreshed CSV files
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python verify_market_data.py --max-age-days 7

      - name: Commit refreshed CSV files
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qqq_daily.csv tqqq_daily.csv
          if git diff --cached --quiet; then
            echo "QQQ and TQQQ CSV files are already current; no commit needed."
          else
            git commit -m "Update QQQ and TQQQ market data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build dashboard from repository data
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.refresh)
        run: python local_app.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Upload detailed reports for email
        uses: actions/upload-artifact@v4
        with:
          name: daily-simulation-report
          path: reports
          if-no-files-found: error
          retention-days: 14

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send_email)) }}
    runs-on: ubuntu-latest
    needs:
      - build
      - deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Download detailed reports
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: daily-simulation-report
          path: notification-report

      - name: Send daily result email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python send_report_email.py --report-dir notification-report
